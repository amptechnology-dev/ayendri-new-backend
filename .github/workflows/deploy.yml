name: Deploy Ayendri Backend

on:
  push:
    branches:
      - master

concurrency:
  group: deploy-ayendri-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd /root/ayendri_backend
            git pull --ff-only
            bash deploy.sh
            docker image prune -f

            echo "Running health check..."
            for i in $(seq 1 10); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" https://backend.ayendri.com/ || echo "000")
              if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then
                echo "health check OK (HTTP $CODE)"
                exit 0
              fi
              echo "  attempt $i/10 - HTTP $CODE, waiting 5s..."
              sleep 5
            done
            echo "ERROR: health check failed"
            docker logs --tail 50 ayendri-app || true
            exit 1